name: pre-deploy verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  privacy-and-token-gates:
    name: required pre-commit verification gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Verify design tokens
        run: python3 -m unittest tests.verify.test_design_tokens -v
      - name: Verify synthetic payload PII guard
        run: python3 -m unittest tests.verify.test_pii_guard -v
