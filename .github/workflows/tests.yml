name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies (offline-friendly)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fpdf2>=2.7.0" "python-docx>=1.0.0"
          python -m pip install "pytest>=7.0"
          python -m pip install "pyyaml>=6.0"

      - name: Verify package metadata parses
        # tomllib is stdlib only on Python 3.11+. On 3.9/3.10 the step is
        # intentionally skipped; the matrix's 3.11+ legs prove the parse.
        if: ${{ matrix.python-version == '3.11' || matrix.python-version == '3.12' }}
        run: |
          python -c "import tomllib; tomllib.loads(open('pyproject.toml').read())"
        shell: bash

      - name: Run unit tests with pytest
        run: |
          python -m pytest engine/tests -v

      - name: Run unit tests with unittest discover
        run: |
          python -m unittest discover engine/tests -v -t .

      - name: Run synthetic demo (offline, no credentials)
        run: |
          python engine/synth_demo.py
        shell: bash

      - name: Run snapshot exporter self-tests
        run: |
          python -m unittest discover snapshot-export/tests -v -t .

      - name: Verify synthetic seed generator
        run: |
          python synthetic-data/generate.py --self-test

      - name: Verify HTML prototype smoke-tests
        run: |
          test -f ui/index.html
          test -f ui/styles.css
          test -f ui/app.js
          python ui/tests/check_seed.py

      - name: Run UI prototype unit tests (T8.3)
        # Pinpoint coverage for the 4 engine screens + the new Research hub
        # (#/research). Includes a test that writes /tmp/ui_test_summary.txt so
        # the T8.5 grep gate below has a file to read.
        run: |
          python -m unittest discover -s ui/tests -t . -v

      - name: Verify T8.5 ui_test_summary gate
        # Gate: `grep -c "telegram|cron|rubric|digest" /tmp/ui_test_summary.txt`
        # must be > 0 (every populated engine screen is reflected).
        run: |
          test -s /tmp/ui_test_summary.txt
          grep -c "telegram\|cron\|rubric\|digest" /tmp/ui_test_summary.txt

      - name: Verify demo outputs the documented files
        run: |
          test -f out/README.md
          test -f out/score.txt
          test -f out/resume.docx
          test -f out/gates.json

      - name: Verify workflow YAML self-parses
        run: |
          python -c "import yaml; yaml.safe_load(open('.github/workflows/tests.yml'))"

      - name: Verify .gitignore covers required paths
        run: |
          grep -E '(^|/)\.env\.(example|local)' .gitignore
          grep -E '(^|/)out/' .gitignore
          grep -E '(^|/)\.venv/' .gitignore
          grep -E '\*\.bak-\*' .gitignore